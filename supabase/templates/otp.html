<!--
  The sign-in code email.

  {{ .Token }} is the one-time code. Supabase's stock templates use
  {{ .ConfirmationURL }} instead — a magic link — which is why an unmodified
  project sends "Confirm your email address" and never sends a code. The OTP
  flow in design/Vyora Authentication.dc.html needs the code, so this template
  replaces both "Confirm signup" and "Magic Link".

  Inline styles only: mail clients strip <style> blocks and know nothing of
  Tailwind. Colours are the sRGB forms of the design tokens.
-->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; color: #3d3a4d; max-width: 420px; margin: 0 auto; padding: 32px 24px;">
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 28px;">
    <span style="display: inline-block; width: 30px; height: 30px; border-radius: 8px; background: #634cd4; color: #ffffff; text-align: center; line-height: 30px; font-weight: 700; font-size: 15px;">V</span>
    <span style="font-size: 15px; font-weight: 600; color: #181928;">Vyora</span>
  </div>

  <h1 style="margin: 0 0 8px; font-size: 22px; font-weight: 650; color: #181928;">Your sign-in code</h1>
  <p style="margin: 0 0 22px; font-size: 14px; line-height: 1.55; color: #6b6880;">
    Enter this code to sign in. It expires in 5 minutes.
  </p>

  <div style="font-family: 'SFMono-Regular', Consolas, monospace; font-size: 30px; font-weight: 700; letter-spacing: 8px; color: #181928; background: #f4f3fa; border: 1px solid #e4e2ee; border-radius: 12px; padding: 18px 20px; text-align: center;">
    {{ .Token }}
  </div>

  <p style="margin: 22px 0 0; font-size: 12.5px; line-height: 1.55; color: #8a879c;">
    If you didn't try to sign in to Vyora, you can ignore this email — nobody
    can get in without this code.
  </p>
</div>
