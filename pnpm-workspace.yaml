packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
# Native postinstall builds, reviewed and allowed explicitly.
allowBuilds:
  # The compiler behind tsx (used by packages/core scripts).
  esbuild: true
  # Next.js image optimization.
  sharp: true
  # Native resolver behind eslint-plugin-import.
  unrs-resolver: true
  # Cloudflare's local Workers runtime (wrangler / opennextjs preview).
  workerd: true
  # Electron desktop shell (apps/desktop) — downloads the Electron binary.
  electron: true
  # Part of electron-builder's toolchain (apps/desktop).
  electron-winstaller: true
